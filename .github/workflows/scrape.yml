name: Scrape listings

on:
  schedule:
    - cron: "17 */2 * * *"   # каждые 2 часа (время UTC), в 17 минут
  workflow_dispatch: {}        # ручной запуск: Actions → Scrape listings → Run workflow

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python -m scraper.main

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "apartments-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Нет изменений в данных"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: обновление объявлений $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # коммиты от GITHUB_TOKEN не запускают другие workflow, поэтому публикуем сайт отсюда же
  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
