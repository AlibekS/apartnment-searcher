name: Deploy site to GitHub Pages

on:
  push:
    paths-ignore:
      - "README.md"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # при push публикуем только из основной ветки репозитория
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # свежая версия ветки (с только что закоммиченными данными)

      - name: Build static site
        run: |
          mkdir -p _site
          cp -r index.html assets data config .nojekyll _site/
          rm -f _site/data/raw_listings.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
